version: "3.9"

# FreightIQ local development stack.
# Brings up: Postgres (TimescaleDB + PostGIS bundled), Redis, the FastAPI backend,
# a Celery worker, and Celery Beat (scheduler for ingestion jobs, Phase 2+).
#
# Usage:
#   cp .env.example .env      # then edit as needed
#   docker compose up -d
#   docker compose exec api alembic upgrade head
#   docker compose exec api python scripts/seed_reference_data.py
#   docker compose exec api python scripts/seed_synthetic_data.py --years-of-history 5
#   curl localhost:8000/health/db

services:
  db:
    # timescale/timescaledb-ha bundles PostGIS alongside TimescaleDB on top of
    # Postgres 16, so we get both extensions from one image (see Section 1.3 /
    # 2.3 of the implementation plan).
    image: timescale/timescaledb-ha:pg16
    container_name: freightiq_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freightiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freightiq}
      POSTGRES_DB: ${POSTGRES_DB:-freightiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - freightiq_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freightiq} -d ${POSTGRES_DB:-freightiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: freightiq_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freightiq_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@db:5432/${POSTGRES_DB:-freightiq}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freightiq_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freightiq}:${POSTGRES_PASSWORD:-freightiq}@db:5432/${POSTGRES_DB:-freightiq}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app worker --loglevel=info

  # Frontend is scaffolded in Phase 6; placeholder service kept here so the
  # compose file's shape doesn't change later, per the modular-monolith plan.
  # frontend:
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "${FRONTEND_PORT:-3000}:3000"
  #   depends_on:
  #     - api

volumes:
  freightiq_pgdata:
