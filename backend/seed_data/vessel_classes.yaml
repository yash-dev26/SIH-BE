# Standard dry-bulk vessel class definitions. DWT bands and typical dimensions
# are industry-standard figures (Baltic Exchange / shipbroking convention),
# not port-specific, so no per-record citation — these are settled
# classifications rather than claims that could be wrong.
#
# Consumed by scripts/seed_reference_data.py -> vessel_classes table.

- class_name: Handysize
  dwt_min: 10000
  dwt_max: 40000
  typical_loa_m: 190.0
  typical_beam_m: 32.0
  typical_laden_draft_m: 10.0

- class_name: Supramax
  dwt_min: 40000
  dwt_max: 60000
  typical_loa_m: 200.0
  typical_beam_m: 32.26
  typical_laden_draft_m: 12.5

- class_name: Panamax
  dwt_min: 60000
  dwt_max: 100000
  typical_loa_m: 225.0
  typical_beam_m: 32.31
  typical_laden_draft_m: 14.5

- class_name: Capesize
  dwt_min: 100000
  dwt_max: 220000
  typical_loa_m: 292.0
  typical_beam_m: 45.0
  typical_laden_draft_m: 18.0
