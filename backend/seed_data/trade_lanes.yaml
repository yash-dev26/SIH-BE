# Trade lane reference data: origin (export) -> destination (ECI discharge) pairs.
#
# `sea_distance_nm` and `typical_transit_days_laden` here are indicative
# placeholder estimates (great-circle-adjacent approximations, not sea-route
# calculations), clearly not the authoritative figures the plan calls for.
# Section 2.1.C specifies the `searoute` Python package as the correct source
# for actual sea-route (not great-circle) distance — that's a Phase 2
# ingestion task. `typical_transit_days_laden` here is derived as
# `sea_distance_nm / (12 knots * 24h)`, a rough Panamax-laden-speed assumption,
# purely to give Phase 1's synthetic data generator something plausible to
# calibrate against.
#
# Port codes reference seed_data/ports.yaml.

